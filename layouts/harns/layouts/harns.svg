  <!-- this computer, with the agent in front -->
  <rect x="8" y="27" width="6" height="5" rx="1" fill="none" stroke="#80868b" stroke-width="1.2"/>
  <rect x="18" y="28" width="30" height="3" rx="1.5" fill="#80868b"/>
  <rect x="11" y="37" width="64" height="17" rx="3" fill="#2a2113"/>
