  <rect x="18" y="65" width="38" height="3" rx="1.5" fill="#80868b"/>
  <path d="M11 71 V118" stroke="#3a3e42" stroke-width="1"/>
  <g fill="none" stroke="#80868b" stroke-width="1.2">
