  <g fill="none" stroke="#5c6166" stroke-width="1.1">
    <path d="M272 136 l4 3 -4 3 z" fill="#5c6166" stroke="none"/>
    <rect x="281" y="136" width="6" height="6" rx="1"/>
    <path d="M296.5 137 a3 3 0 1 0 0.5 2.5"/>
  </g>

  <!-- status bar -->
  <rect x="88" y="190" width="26" height="2.6" rx="1.3" fill="#5c6166"/>
  <rect x="120" y="190" width="30" height="2.6" rx="1.3" fill="#5c6166"/>
  <rect x="252" y="190" width="22" height="2.6" rx="1.3" fill="#25282b"/>
  <rect x="252" y="190" width="14" height="2.6" rx="1.3" fill="#d88179"/>
  <rect x="282" y="190" width="22" height="2.6" rx="1.3" fill="#25282b"/>
  <rect x="282" y="190" width="5" height="2.6" rx="1.3" fill="#80868b"/>
