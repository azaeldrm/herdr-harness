  <rect x="146" y="84" width="84" height="16" rx="5" fill="#141719"/>
  <rect x="154" y="88" width="66" height="3" rx="1.5" fill="#c8ccd0"/>
  <rect x="154" y="94" width="40" height="3" rx="1.5" fill="#c8ccd0"/>
  <g fill="#a9aeb3">
    <rect x="100" y="112" width="116" height="3" rx="1.5"/>
    <rect x="100" y="119" width="96" height="3" rx="1.5"/>
    <rect x="100" y="126" width="108" height="3" rx="1.5"/>
