  <rect x="269.5" y="61.5" width="14" height="2" rx="1" fill="#10a7a7"/>
  <rect x="267" y="69" width="31" height="16" rx="2" fill="#141719"/>
  <rect x="269.5" y="72" width="18" height="2" rx="1" fill="#e9aa35"/>
  <rect x="269.5" y="76.5" width="24" height="1.8" rx="0.9" fill="#80868b"/>
  <rect x="269.5" y="80" width="16" height="1.8" rx="0.9" fill="#80868b"/>
  <g fill="#5c6166">
    <rect x="267" y="89" width="4" height="4" rx="1"/>
    <rect x="267" y="97" width="4" height="4" rx="1"/>
    <rect x="267" y="105" width="4" height="4" rx="1"/>
    <rect x="274" y="90" width="20" height="1.8" rx="0.9"/>
    <rect x="274" y="98" width="16" height="1.8" rx="0.9"/>
